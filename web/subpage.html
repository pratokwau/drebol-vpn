 :root {
   color-scheme: dark;
   --bg: #05070c; --ink: #ffffff;
   --muted: rgba(255,255,255,.72); --soft: rgba(255,255,255,.48);
   --line: rgba(255,255,255,.08); --line-strong: rgba(255,255,255,.16);
   --card: rgba(13,18,30,.70); --card-hover: rgba(20,28,48,.85);
   --accent: #4f8cff; --accent-soft: rgba(79,140,255,.14);
   --indigo: #7952ff; --ok: #38ef7d; --warn: #fbbf24; --bad: #f87171;
 }
 * { box-sizing: border-box; }
 body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); overflow-x:hidden;
        font:15px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        -webkit-font-smoothing:antialiased; }
 a { color:inherit; text-decoration:none; }
 h1, h2, p { margin:0; }

 .bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
 .aurora { position:absolute; inset:-30%; filter:blur(80px); opacity:.85; }
 .aurora span { position:absolute; border-radius:50%; animation:floatOrb 24s ease-in-out infinite; mix-blend-mode:screen; }
 .aurora span:nth-child(1) { width:60vmax; height:60vmax; top:-15%; left:-10%;
   background:radial-gradient(circle at center, rgba(79,140,255,.35), transparent 70%); }
 .aurora span:nth-child(2) { width:50vmax; height:50vmax; bottom:-20%; right:-15%;
   background:radial-gradient(circle at center, rgba(121,82,255,.25), transparent 75%);
   animation-duration:30s; animation-delay:-6s; }
 .aurora span:nth-child(3) { width:45vmax; height:45vmax; top:25%; left:30%;
   background:radial-gradient(circle at center, rgba(56,239,125,.1), transparent 70%);
   animation-duration:34s; animation-delay:-12s; }
 @keyframes floatOrb {
   0%,100% { transform:translate3d(0,0,0) scale(1); }
   33% { transform:translate3d(5vw,-4vh,0) scale(1.1); }
   66% { transform:translate3d(-4vw,5vh,0) scale(.95); } }
 .cyber-grid { position:absolute; inset:0;
   background-image:
     linear-gradient(to right, rgba(255,255,255,0.035) 1px, transparent 1px),
     linear-gradient(to bottom, rgba(255,255,255,0.035) 1px, transparent 1px);
   background-size:48px 48px;
   mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%);
   -webkit-mask-image:radial-gradient(ellipse at center, black 30%, transparent 80%); }
 .vignette { position:absolute; inset:0;
   background:radial-gradient(ellipse at center, transparent 40%, rgba(5,7,12,.85) 100%); }

 .wrap { position:relative; z-index:1; max-width:680px; margin:0 auto; padding:12px 12px 36px; }
 @media (min-width: 900px) { .wrap { max-width:760px; } }

 .top { display:flex; align-items:center; justify-content:space-between; gap:10px;
        min-height:46px; margin-bottom:12px; background:rgba(10,14,24,.85);
        border:1px solid var(--line); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
        padding:7px 12px; border-radius:14px; }
 .brand { display:flex; align-items:center; min-height:36px; }
 .brand img { height:28px; max-height:28px; width:auto; max-width:180px; object-fit:contain; display:block;
              filter:drop-shadow(0 2px 8px rgba(79,140,255,.3)); }
 .brand .word { font-size:22px; font-weight:800; letter-spacing:-.02em; font-family:"Unbounded",sans-serif; color:#fff; }
 .top .support { flex:none; display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 14px;
   border-radius:999px; border:1px solid var(--line-strong); background:rgba(255,255,255,.05);
   color:#fff; font-size:13px; font-weight:700; }
 .top .support:hover { background:rgba(255,255,255,.1); }

 .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
        min-height:52px; padding:0 22px; border-radius:999px; border:1px solid transparent;
        font:inherit; font-size:15px; font-weight:800; cursor:pointer; text-align:center;
        transition:transform .2s ease, box-shadow .2s ease, background .2s, border-color .2s; }
 .btn svg { width:19px; height:19px; flex:none; }
 .btn-main { background:linear-gradient(135deg, #ffffff 0%, #e2e8f5 100%); color:#05070c;
             box-shadow:0 0 0 1px rgba(255,255,255,.4), 0 8px 30px rgba(255,255,255,.16); }
 .btn-main:hover { transform:translateY(-2px); box-shadow:0 0 0 1px #fff, 0 12px 40px rgba(79,140,255,.4); }
 .btn-ghost { background:rgba(255,255,255,.05); color:#fff; border-color:var(--line-strong); font-weight:700; }
 .btn-ghost:hover { background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.35); transform:translateY(-2px); }
 .btn-sm { width:auto; min-height:40px; padding:0 16px; font-size:13px; }
 .stack { display:flex; flex-direction:column; gap:10px; }
 .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
 @media (max-width: 480px) { .pair { grid-template-columns:1fr; } }

 .card.hero::after { content:""; position:absolute; inset:0;
   background:linear-gradient(180deg, rgba(5,7,12,.25), rgba(5,7,12,.55) 60%, rgba(13,18,30,.92)); }
 .card.hero > * { position:relative; z-index:1; }
 .card-title { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:800; margin-bottom:2px; }
 .card-title .ico { width:30px; height:30px; border-radius:9px; display:flex; align-items:center;
                    justify-content:center; background:var(--accent-soft); color:var(--accent); flex:none; }
 .card-title .ico svg { width:15px; height:15px; }
 .card-sub { color:var(--muted); font-size:13px; margin-bottom:10px; }

 .eyebrow { font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
 .hello { font-size:clamp(26px, 7vw, 34px); line-height:1.1; font-weight:800; letter-spacing:-.03em;
          margin:6px 0 4px; font-family:"Unbounded",sans-serif; }
 .muted { color:var(--muted); font-size:14px; }
 .hero-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
 .plan { font-weight:700; color:rgba(255,255,255,.9); }
 .big { font-size:clamp(28px, 8vw, 38px); line-height:1.1; font-weight:800; letter-spacing:-.03em;
        margin:14px 0 2px; font-family:"Unbounded",sans-serif; }
 .big-sub { color:var(--muted); font-size:14px; }
 .stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:18px; }
 @media (max-width: 480px) { .stats { grid-template-columns:1fr 1fr; } .stat:first-child { grid-column:1 / -1; } }
 .stat { background:rgba(5,7,12,.45); border:1px solid var(--line); border-radius:16px; padding:12px; min-width:0; }
 .stat b { display:block; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; font-family:"Unbounded",sans-serif; }
 .stat span { display:block; font-size:12px; color:var(--soft); margin-top:2px; }

 .pill { display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
         font-size:12px; font-weight:700; white-space:nowrap; }
 .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
 .ok { background:rgba(56,239,125,.14); color:var(--ok); }
 .warn { background:rgba(251,191,36,.14); color:var(--warn); }
 .bad { background:rgba(248,113,113,.14); color:var(--bad); }

 .link { display:flex; align-items:center; gap:10px; margin-top:12px; padding:10px 10px 10px 14px;
         background:rgba(5,7,12,.65); border:1px solid var(--line); border-radius:16px; }
 .link code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
              color:var(--muted); font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
 .copy { flex:none; min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line-strong);
         background:rgba(255,255,255,.05); color:#fff; font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
 .copy:hover { background:rgba(255,255,255,.1); }

 .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0;
        border-top:1px solid var(--line); font-size:14px; }
 .row:first-of-type { border-top:0; }
 .row span:first-child { color:rgba(255,255,255,.88); min-width:0; overflow-wrap:anywhere; }
 .row span:last-child { color:var(--soft); text-align:right; }

    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta);
  }
  function openExternal(href) {
    if (TG && TG.openLink && /^https?:\/\//i.test(href)) { TG.openLink(href); return true; }
    return false;
  }
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest("a[data-ext]");
    if (a && openExternal(a.getAttribute("href"))) e.preventDefault();
    var c = e.target.closest && e.target.closest("[data-copy]");
    if (c) copyText(c.getAttribute("data-copy"), c);
  });

  function showQr(url, title, text) {
    $("qrTitle").textContent = title;
    $("qrText").textContent = text;
    var box = $("qrBox");
    if (window.qrcode) {
      try {
        var qr = qrcode(0, "M");
        qr.addData(url); qr.make();
        box.innerHTML = qr.createImgTag(5, 8);
      } catch (e) { box.innerHTML = "<p style='color:#111;font-size:13px;word-break:break-all'>" + esc(url) + "</p>"; }
    } else {
      box.innerHTML = "<p style='color:#111;font-size:13px;word-break:break-all'>" + esc(url) + "</p>";
    }
    $("qrModal").classList.remove("hide");
  }
  $("qrClose").onclick = function () { $("qrModal").classList.add("hide"); };
  $("qrModal").addEventListener("click", function (e) {
    if (e.target === $("qrModal")) $("qrModal").classList.add("hide");
  });

  /* ---------- рендер ---------- */
  var subUrl = "", userName = "";
  function resolveTemplate(tpl) {
    if (!tpl) return "";
    return tpl
      .replace(/\{\{SUBSCRIPTION_LINK\}\}/g, subUrl)
      .replace(/\{\{HAPP_CRYPT4_LINK\}\}/g, "happ://add/" + encodeURIComponent(subUrl))
      .replace(/\{\{HAPP_CRYPT3_LINK\}\}/g, "happ://add/" + encodeURIComponent(subUrl))
      .replace(/\{\{USERNAME\}\}/g, userName);
  }

  function renderHero(resp, tr) {
    var u = resp.user || {};
    var status = String(u.userStatus || "").toLowerCase();
    var exp = u.expiresAt ? new Date(u.expiresAt) : null;
    var indefinite = exp && !isNaN(exp) && exp.getFullYear() >= 2099;
    var now = new Date();
    var isExpired = status === "expired" || (exp && !isNaN(exp) && !indefinite && exp < now);
    var pill, pillKind;
    if (isExpired) { pill = t(tr.expired, "Истекла"); pillKind = "bad"; }
    else if (status === "active") { pill = t(tr.active, "Активна"); pillKind = "ok"; }
    else { pill = u.userStatus || t(tr.inactive, "Неактивна"); pillKind = "warn"; }

    var big, bigSub;
    if (indefinite) { big = "Бессрочно"; bigSub = "без ограничения срока"; }
    else if (isExpired) { big = "Подписка закончилась"; bigSub = "Продлите её в боте — доступ вернётся сразу."; }
    else if (exp && !isNaN(exp)) {
      var days = Math.max(0, Math.ceil((exp - now) / 86400000));
      big = days + " " + plural(days, ["день", "дня", "дней"]);
      bigSub = "осталось · до " + fmtDate(u.expiresAt);
    } else { big = "Подписка активна"; bigSub = ""; }

    var used = u.trafficUsed || "0 B", limit = String(u.trafficLimit == null ? "0" : u.trafficLimit);
    var trafficText = limit === "0" ? used + " · безлимит" : used + " / " + limit;
    var bar = "";
    if (limit !== "0") {
      var usedB = parseSize(used), limitB = parseSize(limit);
      if (usedB != null && limitB) {
        var pct = Math.min(100, Math.round(usedB / limitB * 100));
        bar = '<div class="bar"><div class="bar-fill' + (pct >= 100 ? " full" : "") +
              '" style="width:' + pct + '%"></div></div>' +
              '<div class="bar-note"><span>Использовано ' + pct + '%</span><span>' + esc(trafficText) + "</span></div>";
      }
    }
    var hello = userName ? "Привет, " + userName + "!" : "Ваша подписка";
    return '<div class="card hero">' +
      '<div class="hero-head"><span class="plan">💎 Premium</span><span class="pill ' + pillKind + '">' + esc(pill) + "</span></div>" +
      '<h1 class="hello">' + esc(hello) + "</h1>" +
      '<div class="big">' + esc(big) + "</div>" +
      (bigSub ? '<div class="big-sub">' + esc(bigSub) + "</div>" : "") +
      '<div class="stats">' +
        '<div class="stat"><b>' + esc(indefinite ? "∞" : fmtDate(u.expiresAt)) + "</b><span>" + esc(t(tr.expires, "Истекает")) + "</span></div>" +
        '<div class="stat"><b>' + esc(limit === "0" ? used : limit) + "</b><span>" + esc(limit === "0" ? (lang === "ru" ? "Использовано · безлимит" : "Used · unlimited") : t(tr.bandwidth, "Трафик")) + "</span></div>" +
        '<div class="stat"><b>' + esc(userName || "—") + "</b><span>" + esc(t(tr.name, "Имя пользователя")) + "</span></div>" +
      "</div>" + bar + "</div>";
  }

  function renderConnect(resp, cfg) {
    var tr = cfg.baseTranslations || {};
    var hideGet = cfg.baseSettings && cfg.baseSettings.hideGetLinkButton;
    var out = '<div class="card">' +
      '<div class="card-title"><span class="ico">' + icon("CloudDownload") + "</span>" + esc(lang === "ru" ? "Подключение" : "Connection") + "</div>" +
      '<p class="card-sub">' + esc(lang === "ru"
        ? "Добавьте подписку в приложение одним нажатием или отсканируйте QR-код."
        : "Add the subscription to the app in one tap or scan the QR code.") + "</p>" +
      '<div class="pair">' +
        '<a class="btn btn-main" href="happ://add/' + encodeURIComponent(subUrl) + '">Добавить в Happ</a>' +
        '<a class="btn btn-ghost" href="incy://import/' + encodeURIComponent(subUrl) + '">Добавить в INCY</a>' +
      "</div>" +
      '<div class="link"><code>' + esc(subUrl) + "</code>" +
      '<button class="copy" type="button" data-copy="' + esc(subUrl) + '">' + esc(t(tr.copyLink, "Скопировать ссылку")) + "</button></div>" +
      '<div class="stack" style="margin-top:12px">' +
        '<button class="btn btn-ghost" type="button" id="qrBtn">▦ QR-код подписки</button>' +
        (hideGet ? "" : '<button class="btn btn-ghost" type="button" id="getLinkBtn">🔗 ' + esc(t(tr.getLink, "Получить ссылку")) + "</button>") +
      "</div></div>";
    return out;
  }

  function detectPlatform(keys) {
    var ua = navigator.userAgent || "";
    var guess = /iPhone|iPad|iPod/i.test(ua) ? "ios"
      : /Android/i.test(ua) ? (/TV/i.test(ua) ? "androidTV" : "android")
      : /Macintosh|Mac OS/i.test(ua) ? "macos"
      : /Windows/i.test(ua) ? "windows" : null;
    if (guess && keys.indexOf(guess) !== -1) return guess;
    if (keys.indexOf("ios") !== -1 && /iPhone|iPad|iPod/i.test(ua)) return "ios";
    return keys[0];
  }

  function renderGuides(cfg) {
    var platforms = cfg.platforms || {};
    var keys = Object.keys(platforms).filter(function (k) {
      return platforms[k] && platforms[k].apps && platforms[k].apps.length;
    });
    if (!keys.length) return "";
    var tr = cfg.baseTranslations || {};
    var active = detectPlatform(keys);
    var html = '<div class="card"><div class="card-title"><span class="ico">' + icon("DownloadIcon") + "</span>" +
      esc(t(tr.installationGuideHeader, "Установка")) + "</div>" +
      '<div class="tabs" id="platTabs">' + keys.map(function (k) {
        var p = platforms[k];
        return '<button class="tab' + (k === active ? " active" : "") + '" type="button" data-plat="' + esc(k) + '">' +
          icon(p.svgIconKey || "TV") + esc(t(p.displayName, k)) + "</button>";
      }).join("") + "</div>" +
      '<div id="platBody"></div></div>';

    function renderPlat(key) {
      var p = platforms[key];
      var apps = (p.apps || []).slice().sort(function (a, b) {
        return (b.featured ? 1 : 0) - (a.featured ? 1 : 0);
      });
      var app = apps[0];
      var body = '<div class="app-switch">' + apps.map(function (a, i) {
        return '<button type="button" data-app="' + i + '"' + (a === app ? ' class="active"' : "") + ">" +
          esc(a.name) + (a.featured ? '<span class="feat">' + esc(lang === "ru" ? "Рекомендуем" : "Recommended") + "</span>" : "") + "</button>";
      }).join("") + "</div><div id='appSteps'></div>";
      $("platBody").innerHTML = body;
      renderSteps(app);
      document.querySelectorAll("#platBody .app-switch button").forEach(function (btn) {
        btn.onclick = function () {
          document.querySelectorAll("#platBody .app-switch button").forEach(function (b) { b.classList.remove("active"); });
          btn.classList.add("active");
          renderSteps(apps[+btn.getAttribute("data-app")]);
        };
      });
    }
    function renderSteps(app) {
      var steps = (app.blocks || []).map(function (b, i) {
        var color = iconColor(b.svgIconColor);
        var btns = (b.buttons || []).map(function (btn) {
          var href = resolveTemplate(btn.link);
          if (!href) return "";
          var cls = btn.type === "subscriptionLink" ? "btn btn-main" : "btn btn-ghost";
          return '<a class="' + cls + '" href="' + esc(href) + '"' +
            (/^https?:\/\//i.test(href) ? ' data-ext target="_blank" rel="noopener"' : "") + ">" +
            esc(t(btn.text, "")) + "</a>";
        }).join("");
        return '<div class="step"><div class="step-num">' + (i + 1) + "</div>" +
          '<div class="step-body"><h3><span class="sico" style="color:' + color + '">' + icon(b.svgIconKey) + "</span>" +
          esc(t(b.title, "")) + "</h3><p>" + esc(t(b.description, "")) + "</p>" + btns + "</div></div>";
      }).join("");
      $("appSteps").innerHTML = steps;
    }
    setTimeout(function () {
      renderPlat(active);
      document.querySelectorAll("#platTabs .tab").forEach(function (tab) {
        tab.onclick = function () {
          document.querySelectorAll("#platTabs .tab").forEach(function (x) { x.classList.remove("active"); });
          tab.classList.add("active");
          renderPlat(tab.getAttribute("data-plat"));
        };
      });
    }, 0);
    return html;
  }

  function renderKeys(resp, cfg) {
    var tr = cfg.baseTranslations || {};
    if (!(cfg.baseSettings && cfg.baseSettings.showConnectionKeys)) return "";
    var links = resp.links || [];
    if (!links.length) return "";
    var rows = links.map(function (link) {
      var name = String(link).split("#")[1] || "Ключ";
      name = name.split(";")[0].split("?")[0];
      var short = link.length > 40 ? link.slice(0, 40) + "…" : link;
      return '<div class="key"><div><b>' + esc(decodeURIComponent(name)) + "</b><small>" + esc(short) + "</small></div>" +
        '<button class="copy" type="button" data-qr="' + esc(link) + '">QR</button>' +
        '<button class="copy" type="button" data-copy="' + esc(link) + '">' + esc(t(tr.copyLink, "Копировать")) + "</button></div>";
    }).join("");
    return '<div class="card"><div class="card-title"><span class="ico">' + icon("Check") + "</span>" +
      esc(t(tr.connectionKeysHeader, "Ключи подключения")) + "</div>" + rows + "</div>";
  }

  function render() {
    var resp = (panelData && panelData.response) || { isFound: false };
    $("loading").classList.add("hide");
    if (!resp.isFound) { $("notfound").classList.remove("hide"); return; }
    var cfg = appConfig || FALLBACK_CONFIG;
    var tr = cfg.baseTranslations || {};
    var branding = cfg.brandingSettings || {};
    if (branding.logoUrl) $("brandLogo").src = branding.logoUrl;
    var support = branding.supportUrl || BOT_URL;
    $("supportBtn").href = support;
    if (cfg.baseSettings && cfg.baseSettings.metaTitle) {
      document.title = cfg.baseSettings.metaTitle;
      var md = $("metaDesc");
      if (md && cfg.baseSettings.metaDescription) md.setAttribute("content", cfg.baseSettings.metaDescription);
    }
    subUrl = resp.subscriptionUrl || "";
    userName = (resp.user && resp.user.username) || "";
    $("heroSlot").innerHTML = renderHero(resp, tr);
    $("connectSlot").innerHTML = renderConnect(resp, cfg);
    $("guidesSlot").innerHTML = renderGuides(cfg);
    $("keysSlot").innerHTML = renderKeys(resp, cfg);
    $("app").classList.remove("hide");
    var qrBtn = $("qrBtn");
    if (qrBtn) qrBtn.onclick = function () {
      showQr(subUrl, lang === "ru" ? "QR-код подписки" : "Subscription QR code",
             t(tr.scanQrCode, "Отсканируйте QR-код в приложении"));
    };
    var gl = $("getLinkBtn");
    if (gl) gl.onclick = function () { copyText(subUrl, gl); };
    document.querySelectorAll("[data-qr]").forEach(function (btn) {
      btn.onclick = function () {
        showQr(btn.getAttribute("data-qr"), lang === "ru" ? "QR-код ключа" : "Key QR code",
               t(tr.scanQrCode, "Отсканируйте QR-код в приложении"));
      };
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    loadPanelData();
    loadConfig().then(render);
  });
})();
</script>
</body></html>
