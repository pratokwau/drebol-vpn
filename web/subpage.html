<style>
 /* Дизайн luxury minimalism — тот же, что на лендинге (web/site_page.py)
    и в кабинете (CABINET_PAGE): кремовый фон #F7F3EB, Manrope,
    чёрные акценты, золотая hairline-линия. */
 :root {
   color-scheme: light;
   --bg: #F7F3EB; --bg-2: #FDFAF1; --ink: #0E0E0E;
   --muted: #6E6A61; --soft: #9A948A;
   --line: #E4DDCC; --line-strong: #D8CFB9;
   --card: #FFFFFF; --card-2: #FDFAF1;
   --accent: #0E0E0E; --accent-soft: rgba(14,14,14,.06);
   --gold: #C9B896; --gold-dark: #8C7A45; --dark: #0A0A0A;
   --ok: #1E7A4C; --ok-bg: rgba(30,122,76,.12);
   --warn: #8A5A00; --warn-bg: rgba(138,90,0,.12);
   --bad: #B3352C; --bad-bg: rgba(179,53,44,.10);
 }
 * { box-sizing: border-box; }
 body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); overflow-x:hidden;
        font:15px/1.55 "Manrope","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
        -webkit-font-smoothing:antialiased; }
 a { color:inherit; text-decoration:none; }
 h1, h2, p { margin:0; }

 .bg { position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden; }
 .aurora { position:absolute; inset:-30%; filter:blur(90px); opacity:.85; }
 .aurora span { position:absolute; border-radius:50%; animation:floatOrb 24s ease-in-out infinite; }
 .aurora span:nth-child(1) { width:60vmax; height:60vmax; top:-15%; left:-10%;
   background:radial-gradient(circle at center, rgba(201,184,150,.30), transparent 70%); }
 .aurora span:nth-child(2) { width:50vmax; height:50vmax; bottom:-20%; right:-15%;
   background:radial-gradient(circle at center, rgba(201,184,150,.18), transparent 70%);
   animation-duration:30s; animation-delay:-6s; }
 .aurora span:nth-child(3) { width:45vmax; height:45vmax; top:25%; left:30%;
   background:radial-gradient(circle at center, rgba(201,184,150,.12), transparent 70%);
   animation-duration:34s; animation-delay:-12s; }
 @keyframes floatOrb {
   0%,100% { transform:translate3d(0,0,0) scale(1); }
   33% { transform:translate3d(5vw,-4vh,0) scale(1.1); }
   66% { transform:translate3d(-4vw,5vh,0) scale(.95); } }
 .cyber-grid { display:none; }
 .vignette { display:none; }

 .wrap { position:relative; z-index:1; max-width:680px; margin:0 auto; padding:12px 12px 36px; }
 @media (min-width: 900px) { .wrap { max-width:760px; } }

 .top { display:flex; align-items:center; justify-content:space-between; gap:10px;
        min-height:46px; margin-bottom:12px; background:rgba(253,250,241,.85);
        border:1px solid var(--line); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
        padding:7px 12px; border-radius:16px; }
 .brand { display:flex; align-items:center; min-height:36px; }
 .brand img { height:28px; max-height:28px; width:auto; max-width:180px; object-fit:contain; display:block; }
 .brand .word { font-size:22px; font-weight:800; letter-spacing:-.02em; font-family:"Manrope",sans-serif; color:var(--ink); }
 .top .support { flex:none; display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 14px;
   border-radius:999px; border:1px solid var(--line-strong); background:#fff;
   color:var(--ink); font-size:13px; font-weight:700; }
 .top .support:hover { background:var(--bg-2); border-color:var(--ink); }

 .btn { display:flex; align-items:center; justify-content:center; gap:10px; width:100%;
        min-height:52px; padding:0 22px; border-radius:999px; border:1px solid transparent;
        font:inherit; font-size:15px; font-weight:800; cursor:pointer; text-align:center;
        transition:transform .2s ease, box-shadow .2s ease, background .2s, border-color .2s; }
 .btn svg { width:19px; height:19px; flex:none; }
 .btn-main { background:#0E0E0E; color:#F7F3EB;
             box-shadow:0 10px 26px rgba(14,14,14,.22); }
 .btn-main:hover { transform:translateY(-2px); box-shadow:0 14px 34px rgba(14,14,14,.28); }
 .btn-ghost { background:#fff; color:var(--ink); border-color:var(--line-strong); font-weight:700; }
 .btn-ghost:hover { background:var(--bg-2); border-color:var(--ink); transform:translateY(-2px); }
 .btn-sm { width:auto; min-height:40px; padding:0 16px; font-size:13px; }
 .stack { display:flex; flex-direction:column; gap:10px; }
 .pair { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
 @media (max-width: 480px) { .pair { grid-template-columns:1fr; } }

 .card { background:var(--card); border:1px solid var(--line); border-radius:20px;
         padding:16px; margin:10px 0;
         box-shadow:0 10px 30px rgba(14,14,14,.06); position:relative; }
 .card::before { content:""; position:absolute; top:0; left:24px; right:24px; height:1px;
   background:linear-gradient(90deg, transparent, var(--gold), transparent); pointer-events:none; }
 .card.hero { position:relative; overflow:hidden; border-color:var(--dark);
              background:var(--dark); color:#F7F3EB;
              box-shadow:0 18px 44px rgba(14,14,14,.28); }
 .card.hero::before { content:""; position:absolute; inset:0;
   background:
     radial-gradient(120% 90% at 50% 0%, rgba(201,184,150,.22), rgba(201,184,150,0) 60%),
     radial-gradient(80% 60% at 85% 100%, rgba(201,184,150,.12), rgba(201,184,150,0) 65%),
     #0A0A0A; }
 .card.hero::after { content:""; position:absolute; inset:0;
   background:linear-gradient(180deg, rgba(0,0,0,.1), rgba(0,0,0,.3) 60%, rgba(10,10,10,.5)); }
 .card.hero > * { position:relative; z-index:1; }
 .card.hero .card-sub { color:rgba(247,243,235,.72); }
 .card.hero .plan { color:#F7F3EB; }
 .card.hero .big { color:#F7F3EB; }
 .card.hero .big-sub { color:rgba(247,243,235,.66); }
 .card.hero .card-title { color:#F7F3EB; }
 .card.hero .card-title .ico { background:rgba(255,255,255,.10); color:#F7F3EB; }
 .card.hero .btn-main { background:#F7F3EB; color:#0E0E0E; box-shadow:0 10px 26px rgba(0,0,0,.35); }
 .card.hero .btn-main:hover { box-shadow:0 14px 34px rgba(0,0,0,.45); }
 .card.hero .stat { background:rgba(255,255,255,.06); border-color:rgba(255,255,255,.12); }
 .card.hero .stat b { color:#F7F3EB; }
 .card.hero .stat span { color:rgba(247,243,235,.60); }
 .card.hero .bar { background:rgba(255,255,255,.14); }
 .card.hero .bar-fill { background:linear-gradient(90deg, #F7F3EB, var(--gold)); box-shadow:none; }
 .card.hero .bar-note { color:rgba(247,243,235,.60); }
 .card.hero .pill.ok { background:rgba(74,222,128,.16); color:#4ADE80; }
 .card.hero .pill.warn { background:rgba(251,191,36,.16); color:#FBBF24; }
 .card.hero .pill.bad { background:rgba(248,113,113,.16); color:#F87171; }
 .card-title { display:flex; align-items:center; gap:9px; font-size:15px; font-weight:800; margin-bottom:2px; }
 .card-title .ico { width:30px; height:30px; border-radius:9px; display:flex; align-items:center;
                    justify-content:center; background:var(--accent-soft); color:var(--ink); flex:none; }
 .card-title .ico svg { width:15px; height:15px; }
 .card-sub { color:var(--muted); font-size:13px; margin-bottom:10px; }

 .eyebrow { font-size:12px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-dark); }
 .hello { font-size:clamp(26px, 7vw, 34px); line-height:1.1; font-weight:800; letter-spacing:-.03em;
          margin:6px 0 4px; font-family:"Manrope",sans-serif; }
 .muted { color:var(--muted); font-size:14px; }
 .hero-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
 .plan { font-weight:700; color:var(--ink); }
 .big { font-size:clamp(28px, 8vw, 38px); line-height:1.1; font-weight:800; letter-spacing:-.03em;
        margin:14px 0 2px; font-family:"Manrope",sans-serif; }
 .big-sub { color:var(--muted); font-size:14px; }
 .stats { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin-top:18px; }
 @media (max-width: 480px) { .stats { grid-template-columns:1fr 1fr; } .stat:first-child { grid-column:1 / -1; } }
 .stat { background:var(--card-2); border:1px solid var(--line); border-radius:16px; padding:12px; min-width:0; }
 .stat b { display:block; font-size:15px; font-weight:800; white-space:nowrap; overflow:hidden;
           text-overflow:ellipsis; font-family:"Manrope",sans-serif; }
 .stat span { display:block; font-size:12px; color:var(--soft); margin-top:2px; }

 .pill { display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
         font-size:12px; font-weight:700; white-space:nowrap; }
 .pill::before { content:""; width:6px; height:6px; border-radius:50%; background:currentColor; }
 .ok { background:var(--ok-bg); color:var(--ok); }
 .warn { background:var(--warn-bg); color:var(--warn); }
 .bad { background:var(--bad-bg); color:var(--bad); }

 .link { display:flex; align-items:center; gap:10px; margin-top:12px; padding:10px 10px 10px 14px;
         background:var(--bg-2); border:1px solid var(--line); border-radius:16px; }
 .link code { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
              color:var(--muted); font-size:13px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
 .copy { flex:none; min-height:40px; padding:0 14px; border-radius:999px; border:1px solid var(--line-strong);
         background:#fff; color:var(--ink); font:inherit; font-size:13px; font-weight:700; cursor:pointer; }
 .copy:hover { background:var(--bg-2); border-color:var(--ink); }

 .row { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:11px 0;
        border-top:1px solid var(--line); font-size:14px; }
 .row:first-of-type { border-top:0; }
 .row span:first-child { color:var(--ink); min-width:0; overflow-wrap:anywhere; }
 .row span:last-child { color:var(--soft); text-align:right; }

 .bar { height:10px; border-radius:999px; background:rgba(14,14,14,.08); overflow:hidden; margin-top:14px; }
 .bar-fill { height:100%; border-radius:999px; background:linear-gradient(90deg, #0E0E0E, #5A5244); }
 .bar-fill.full { background:linear-gradient(90deg, #B7791F, #B3352C); }
 .bar-note { display:flex; justify-content:space-between; gap:12px; margin-top:8px; font-size:13px; color:var(--soft); }

 /* Шаги установки: номер, иконка в цвете из app-config, текст, кнопки.
    Иконки шагов JS красит инлайном в синий (ICON_COLORS) — перебиваем
    в чёрный, чтобы синего не осталось даже в шагах. */
 .step { display:flex; gap:12px; padding:14px 0; border-top:1px solid var(--line); }
 .step:first-of-type { border-top:0; }
 .step-num { flex:none; width:30px; height:30px; border-radius:50%; display:flex; align-items:center;
             justify-content:center; font-size:13px; font-weight:800; color:var(--ink);
             background:rgba(14,14,14,.06); border:1px solid var(--line-strong); }
 .step-body { flex:1; min-width:0; }
 .step-body h3 { margin:0 0 4px; font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px; }
 .step-body h3 .sico { width:22px; height:22px; display:inline-flex; flex:none; color:var(--ink) !important; }
 .step-body h3 .sico svg { width:22px; height:22px; }
 .step-body p { color:var(--muted); font-size:13px; margin:0 0 10px; }
 .step-body .btn { min-height:46px; font-size:14px; margin-top:8px; }
 .app-switch { display:flex; gap:8px; margin:2px 0 6px; flex-wrap:wrap; }
 .app-switch button { flex:1; min-height:44px; padding:0 14px; border-radius:999px; cursor:pointer;
   border:1px solid var(--line-strong); background:#fff; color:var(--muted);
   font:inherit; font-size:14px; font-weight:700; white-space:nowrap; }
 .app-switch button.active { background:#0E0E0E; color:#F7F3EB; border-color:#0E0E0E; }
 .app-switch button .feat { font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
   color:var(--gold-dark); margin-left:6px; }
 .app-switch button.active .feat { color:var(--gold); }

 .tabs { position:sticky; top:0; z-index:5; display:flex; gap:6px; overflow-x:auto;
         margin:0 -12px; padding:7px 12px; background:rgba(247,243,235,.92);
         backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); scrollbar-width:none; }
 .tabs::-webkit-scrollbar { display:none; }
 .tab { flex:none; display:inline-flex; align-items:center; gap:7px; min-height:36px; padding:0 13px;
        border-radius:999px; border:1px solid var(--line-strong); background:#fff;
        color:var(--muted); font:inherit; font-size:13px; font-weight:700; cursor:pointer; white-space:nowrap; }
 .tab svg { width:16px; height:16px; }
 .tab.active { background:#0E0E0E; color:#F7F3EB; border-color:#0E0E0E; box-shadow:0 3px 12px rgba(14,14,14,.2); }

 .key { display:flex; align-items:center; gap:10px; padding:11px 0; border-top:1px solid var(--line); }
 .key:first-of-type { border-top:0; }
 .key b { display:block; font-size:14px; overflow-wrap:anywhere; }
 .key small { color:var(--soft); font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
              overflow-wrap:anywhere; }
 .key .copy { margin-left:auto; }

 .foot { text-align:center; margin-top:28px; font-size:13px; color:var(--soft); }
 .hide { display:none !important; }
 .center { text-align:center; }
 .spin { width:34px; height:34px; margin:40px auto 12px; border-radius:50%;
         border:3px solid rgba(14,14,14,.15); border-top-color:var(--ink); animation:spin 1s linear infinite; }
 @keyframes spin { to { transform:rotate(360deg); } }

 /* Модалка QR-кода */
 .modal { position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center;
          padding:20px; background:rgba(14,14,14,.55); backdrop-filter:blur(6px); }
 .modal-card { width:100%; max-width:340px; background:#fff; border:1px solid var(--line-strong);
               border-radius:20px; padding:20px; text-align:center; box-shadow:0 20px 60px rgba(14,14,14,.25); }
 .modal-card h2 { font-size:18px; font-weight:800; margin-bottom:4px; font-family:"Manrope",sans-serif; }
 .modal-card p { color:var(--muted); font-size:13px; margin-bottom:14px; }
 .qr-box { background:#fff; border-radius:14px; padding:12px; display:inline-block; line-height:0; }
 .qr-box img, .qr-box table { margin:0 auto; }
 .modal-card .btn { margin-top:14px; }
 @media (prefers-reduced-motion: reduce) { .aurora span, .spin { animation:none; } }
</style></head>

  function loadPanelData() {
    /* Данные подписки сервер подставляет сам при старте контейнера:
       он компилирует этот файл как EJS-шаблон и кладёт base64 JSON
       в атрибут data-panel у div#sbpg (см. разметку перед скриптом).
       Старый плейсхолдер {{.PanelData}} (Orion) в этой версии сервера
       не подставляется — оставлен как запасной вариант. Внедрённый
       объект — голый SubscriptionInfo без обёртки response, поэтому
       нормализуем его здесь в привычный вид { response: ... }. */
    var raw = "";
    var div = document.getElementById("sbpg");
    if (div) raw = div.getAttribute("data-panel") || "";
    if (!raw || raw.indexOf("<" + "%") !== -1) raw = "{{.PanelData}}";
    if (!raw || raw.indexOf("{{") !== -1 || raw.indexOf("<" + "%") !== -1) { panelData = { response: { isFound: false } }; return; }
    try {
      var bin = atob(raw);
      var bytes = new Uint8Array(bin.length);
      for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      var text = (window.TextDecoder ? new TextDecoder("utf-8").decode(bytes) : decodeURIComponent(escape(bin)));
      var parsed = JSON.parse(text);
      panelData = parsed && parsed.response ? parsed : { response: parsed };
    } catch (e) {
      console.error("PanelData decode failed", e);
      panelData = { response: { isFound: false } };
    }
  }

          var cls = btn.type === "subscriptionLink" ? "btn btn-main" : "btn btn-ghost";
          return '<a class="' + cls + '" href="' + esc(href) + '"' +
            (/^https?:\/\//i.test(href) ? ' data-ext target="_blank" rel="noopener"' : "") + ">" +
            esc(t(btn.text, "")) + "</a>";
        }).join("");
        return '<div class="step"><div class="step-num">' + (i + 1) + "</div>" +
          '<div class="step-body"><h3><span class="sico" style="color:' + color + '">' + icon(b.svgIconKey) + "</span>" +
          esc(t(b.title, "")) + "</h3><p>" + esc(t(b.description, "")) + "</p>" + btns + "</div></div>";
      }).join("");
      $("appSteps").innerHTML = steps;
    }
    setTimeout(function () {
      renderPlat(active);
      document.querySelectorAll("#platTabs .tab").forEach(function (tab) {
        tab.onclick = function () {
          document.querySelectorAll("#platTabs .tab").forEach(function (x) { x.classList.remove("active"); });
          tab.classList.add("active");
          renderPlat(tab.getAttribute("data-plat"));
        };
      });
    }, 0);
    return html;
  }

  function renderKeys(resp, cfg) {
    var tr = cfg.baseTranslations || {};
    if (!(cfg.baseSettings && cfg.baseSettings.showConnectionKeys)) return "";
    var links = resp.links || [];
    if (!links.length) return "";
    var rows = links.map(function (link) {
      var name = String(link).split("#")[1] || "Ключ";
      name = name.split(";")[0].split("?")[0];
      var short = link.length > 40 ? link.slice(0, 40) + "…" : link;
      return '<div class="key"><div><b>' + esc(decodeURIComponent(name)) + "</b><small>" + esc(short) + "</small></div>" +
        '<button class="copy" type="button" data-qr="' + esc(link) + '">QR</button>' +
        '<button class="copy" type="button" data-copy="' + esc(link) + '">' + esc(t(tr.copyLink, "Копировать")) + "</button></div>";
    }).join("");
    return '<div class="card"><div class="card-title"><span class="ico">' + icon("Check") + "</span>" +
      esc(t(tr.connectionKeysHeader, "Ключи подключения")) + "</div>" + rows + "</div>";
  }

  function render() {
    var resp = (panelData && panelData.response) || { isFound: false };
    $("loading").classList.add("hide");
    if (!resp.isFound) { $("notfound").classList.remove("hide"); return; }
    var cfg = appConfig || FALLBACK_CONFIG;
    var tr = cfg.baseTranslations || {};
    var branding = cfg.brandingSettings || {};
    if (branding.logoUrl) $("brandLogo").src = branding.logoUrl;
    var support = branding.supportUrl || SUPPORT_URL;
    $("supportBtn").href = support;
    if (cfg.baseSettings && cfg.baseSettings.metaTitle) {
      document.title = cfg.baseSettings.metaTitle;
      var md = $("metaDesc");
      if (md && cfg.baseSettings.metaDescription) md.setAttribute("content", cfg.baseSettings.metaDescription);
    }
    subUrl = resp.subscriptionUrl || "";
    userName = (resp.user && resp.user.username) || "";
    $("heroSlot").innerHTML = renderHero(resp, tr);
    $("connectSlot").innerHTML = renderConnect(resp, cfg);
    $("guidesSlot").innerHTML = renderGuides(cfg);
    $("keysSlot").innerHTML = renderKeys(resp, cfg);
    $("app").classList.remove("hide");
    var qrBtn = $("qrBtn");
    if (qrBtn) qrBtn.onclick = function () {
      showQr(subUrl, lang === "ru" ? "QR-код подписки" : "Subscription QR code",
             t(tr.scanQrCode, "Отсканируйте QR-код в приложении"));
    };
    var gl = $("getLinkBtn");
    if (gl) gl.onclick = function () { copyText(subUrl, gl); };
    document.querySelectorAll("[data-qr]").forEach(function (btn) {
      btn.onclick = function () {
        showQr(btn.getAttribute("data-qr"), lang === "ru" ? "QR-код ключа" : "Key QR code",
               t(tr.scanQrCode, "Отсканируйте QR-код в приложении"));
      };
    });
  }

  document.addEventListener("DOMContentLoaded", function () {
    loadPanelData();
    loadConfig().then(render);
  });
})();
</script>
</body></html>
